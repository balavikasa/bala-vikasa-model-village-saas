services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: "production"
      DATABASE_URL: postgresql+psycopg://model_village:${POSTGRES_PASSWORD}@postgres:5432/model_village
      SESSION_COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/srv/app/uploads

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: model_village
      POSTGRES_USER: model_village
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U model_village -d model_village"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
  uploads:
