<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Village — Field Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#1B1F23; --paper:#F3F1EA; --card:#ffffff; --line:#E3DECF;
    --navy:#1F4E5F; --navy-2:#163a47; --rail:#132630;
    --saffron:#E8A93A; --clay:#C1543C; --leaf:#5B8C5E; --sky:#3B6EA5; --muted:#6b6455;
    --shadow: 0 1px 2px rgba(20,30,35,.04), 0 4px 14px rgba(20,30,35,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; display:flex; min-height:100vh;}
  ::selection{background:var(--saffron); color:var(--ink);}
  a{color:inherit;} button{font-family:inherit;}

  #rail{width:66px; flex-shrink:0; background:var(--rail); display:flex; flex-direction:column; align-items:center; padding:18px 0; gap:6px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  #rail .rmark{width:34px;height:34px;border-radius:8px; background:var(--saffron); display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:#1c1305; font-size:15px; margin-bottom:14px;}
  .nav-btn{width:44px;height:44px;border-radius:9px; display:flex;align-items:center;justify-content:center; color:#9fb3ba; cursor:pointer; border:none; background:transparent; transition:background .15s,color .15s;}
  .nav-btn svg{width:19px;height:19px;}
  .nav-btn:hover{background:rgba(255,255,255,.06); color:#e7ede9;}
  .nav-btn.active{background:rgba(232,169,58,.16); color:var(--saffron);}
  .nav-label{font-family:'IBM Plex Mono',monospace; font-size:8.2px; letter-spacing:.05em; color:#7c8f96; margin-top:2px; text-transform:uppercase;}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:6px;cursor:pointer;}

  #shell{flex:1; display:flex; flex-direction:column; min-width:0;}
  #topbar{background:#fff; border-bottom:1px solid var(--line); padding:12px 28px; display:flex; align-items:center; justify-content:space-between; gap:18px; position:sticky; top:0; z-index:20; flex-wrap:wrap;}
  #topbar .titleblock h1{font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin:0; line-height:1.2;}
  #topbar .titleblock p{margin:1px 0 0; font-size:11.5px; color:var(--muted);}
  .role-seg{display:flex; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:3px; gap:2px;}
  .role-seg button{border:none; background:transparent; padding:6px 12px; border-radius:6px; font-size:12.5px; font-weight:500; color:var(--muted); cursor:pointer;}
  .role-seg button.active{background:var(--navy); color:#fff;}
  #entityPicker select{padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; font-family:'Inter',sans-serif; font-size:12.5px; color:var(--ink); min-width:170px;}
  .whoami{display:flex; align-items:center; gap:8px;}
  .whoami img{width:32px;height:32px;border-radius:50%;border:1px solid var(--line); background:#eee;}
  .whoami .wname{font-size:12px; font-weight:600; line-height:1.2;}
  .whoami .wrole{font-size:10.5px; color:var(--muted);}

  #content{padding:26px 28px 60px; max-width:1260px; width:100%;}
  .proto-banner{margin:0 0 22px; padding:10px 14px; background:#fff8e8; border:1px solid var(--saffron); border-left:4px solid var(--saffron); border-radius:6px; font-size:12px; color:#6b5323; line-height:1.5;}
  .demo-banner{margin:0 0 18px; padding:10px 14px; background:#eef3fb; border:1px solid var(--sky); border-left:4px solid var(--sky); border-radius:6px; font-size:12px; color:#233f5c; line-height:1.5;}

  .section-title{font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin:0 0 4px;}
  .section-sub{font-size:12.5px; color:var(--muted); margin-bottom:10px;}
  .ledger-rule{height:1px; background:var(--line); margin:26px 0;}

  .kpi-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:16px 0 6px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; box-shadow:var(--shadow);}
  .kpi .num{font-family:'IBM Plex Mono',monospace; font-size:25px; font-weight:600; color:var(--navy);}
  .kpi .lbl{font-size:11px; color:var(--muted); margin-top:2px;}
  .kpi.st-early .num{color:var(--sky);} .kpi.st-ontime .num{color:var(--leaf);}
  .kpi.st-postponed .num{color:var(--saffron);} .kpi.st-failure .num{color:var(--clay);}

  #hero-wrap{margin:22px 0 6px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:linear-gradient(180deg,#0f2530,#1a3947); position:relative; box-shadow:var(--shadow);}
  #hero-wrap .hero-caption{position:absolute; left:16px; bottom:14px; color:#eef3f2; font-family:'IBM Plex Mono',monospace; font-size:11px; background:rgba(15,37,48,.55); padding:6px 10px; border-radius:5px; line-height:1.5;}
  #hero-wrap .hero-legend{position:absolute; right:16px; top:14px; display:flex; gap:14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#eef3f2;}
  #hero-wrap .hero-legend span{display:flex;align-items:center;gap:6px;}
  #hero-wrap .hero-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  #heroCanvas{display:block;width:100%;height:360px;}

  .chart-row{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-top:18px;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px 6px; box-shadow:var(--shadow);}
  .panel h3{font-family:'Fraunces',serif; font-size:15.5px; font-weight:600; margin:0 0 3px;}
  .panel .sub{font-size:11.5px; color:var(--muted); margin-bottom:6px;}

  table.ledger{width:100%; border-collapse:collapse; font-size:12.6px; margin-top:6px;}
  table.ledger thead th{text-align:left; font-family:'IBM Plex Mono',monospace; font-size:9.8px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); padding:8px 9px; white-space:nowrap;}
  table.ledger tbody td{padding:8px 9px; border-bottom:1px solid #eee7d5; vertical-align:middle;}
  table.ledger tbody tr:hover{background:#faf7ee;}
  table.ledger.clickable tbody tr{cursor:pointer;}
  .tag{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; padding:2px 7px; border-radius:4px; color:#fff;}
  .tag.csrb{background:var(--leaf);} .tag.pdtc{background:var(--clay);}
  .badge{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; padding:3px 8px; border-radius:20px; color:#fff; white-space:nowrap;}
  .badge.early{background:var(--sky);} .badge.ontime{background:var(--leaf);}
  .badge.postponed{background:var(--saffron); color:#4a3305;} .badge.failure{background:var(--clay);}
  .badge.scheduled{background:#c9c2ac; color:#4a4636;}
  .thumb{width:52px;height:36px;border-radius:5px;object-fit:cover;border:1px solid var(--line); cursor:pointer;}
  .gpslink{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--navy); text-decoration:none;}

  .rbac-note{margin-top:22px; padding:14px 16px; background:#EFE9D8; border-radius:8px; font-size:12px; line-height:1.6; color:#4b4636;}
  .rbac-note b{color:var(--navy);}

  .dir-toolbar{display:flex; gap:10px; align-items:center; margin:14px 0 18px; flex-wrap:wrap;}
  .dir-toolbar input, .filter-bar select, .filter-bar input{padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff;}
  .dir-toolbar input{width:240px;}
  .filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 6px; align-items:center;}
  .people-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
  .person-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s, box-shadow .12s;}
  .person-card:hover{transform:translateY(-2px); box-shadow:0 4px 18px rgba(20,30,35,.12);}
  .person-card img{width:64px; height:64px; border-radius:50%; background:#eee; border:2px solid var(--line); margin-bottom:8px;}
  .person-card .pname{font-weight:600; font-size:13.5px;}
  .person-card .prole{font-size:10.8px; color:var(--muted); margin:2px 0 8px;}
  .person-card .pstats{display:flex; justify-content:center; gap:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--navy);}
  .person-card .pstats div span{display:block; color:var(--muted); font-size:9px; font-family:'Inter',sans-serif;}
  .locked-card{opacity:.42; filter:grayscale(.5); pointer-events:none; position:relative;}
  .locked-card::after{content:"🔒 out of scope"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:#7a7263; background:rgba(255,255,255,.4);}
  .subhead{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:22px 0 8px;}

  .profile-back{font-size:12.5px; color:var(--navy); cursor:pointer; display:inline-flex; align-items:center; gap:5px; margin-bottom:12px;}
  .profile-head{display:flex; gap:18px; align-items:center; margin-bottom:6px; flex-wrap:wrap;}
  .profile-head img{width:84px; height:84px; border-radius:50%; border:3px solid var(--card); box-shadow:var(--shadow); background:#eee;}
  .profile-head h2{font-family:'Fraunces',serif; font-size:24px; margin:0;}
  .profile-head .pmeta{font-size:12.5px; color:var(--muted); margin-top:4px;}

  #mapEl{height:560px; border-radius:10px; border:1px solid var(--line); box-shadow:var(--shadow);}
  .map-legend{display:flex; gap:16px; margin:10px 0 14px; font-size:12px; align-items:center;}
  .map-legend span{display:flex; align-items:center; gap:6px;}
  .map-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .leaflet-popup-content{font-family:'Inter',sans-serif; font-size:12.5px; min-width:190px;}
  .leaflet-popup-content b{font-family:'Fraunces',serif; font-size:14px;}
  .popup-photo{width:100%; height:90px; object-fit:cover; border-radius:6px; margin:6px 0;}

  /* ---------- Entry form ---------- */
  .entry-form{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 22px; box-shadow:var(--shadow); max-width:720px;}
  .entry-form label{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:14px 0 5px;}
  .entry-form label:first-child{margin-top:0;}
  .entry-form select, .entry-form input[type=text], .entry-form input[type=date], .entry-form input[type=number], .entry-form textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px; font-family:'Inter',sans-serif; font-size:13.5px; background:#fcfbf7;
  }
  .entry-form textarea{resize:vertical; min-height:56px;}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .type-toggle{display:flex; gap:8px;}
  .type-toggle button{flex:1; padding:9px; border:1px solid var(--line); border-radius:7px; background:#fcfbf7; cursor:pointer; font-size:13px; font-weight:500; color:var(--muted);}
  .type-toggle button.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .desig-chips{display:flex; gap:8px; flex-wrap:wrap;}
  .desig-chips label{display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:12.5px; text-transform:none; letter-spacing:0; color:var(--ink); margin:0; background:#fcfbf7; border:1px solid var(--line); padding:6px 10px; border-radius:20px; cursor:pointer;}
  .desig-chips input{width:auto;}
  .gps-row{display:flex; gap:10px; align-items:center;}
  .gps-row button{padding:9px 14px; border:1px solid var(--navy); background:#fff; color:var(--navy); border-radius:7px; cursor:pointer; font-size:12.5px; font-weight:500;}
  .gps-row .gpsval{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted);}
  .photo-drop{border:1.5px dashed var(--line); border-radius:8px; padding:16px; text-align:center; cursor:pointer; background:#fcfbf7;}
  .photo-drop img{max-width:100%; max-height:160px; border-radius:6px; margin-top:8px;}
  .submit-btn{margin-top:20px; width:100%; padding:12px; background:var(--saffron); border:none; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; color:#1c1305;}
  .submit-btn:hover{filter:brightness(1.04);}
  .form-note{font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 20px; border-radius:8px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:100; opacity:0; transition:opacity .25s;}
  .toast.show{opacity:1;}

  .lightbox{position:fixed; inset:0; background:rgba(15,20,24,.82); display:flex; align-items:center; justify-content:center; z-index:200;}
  .lightbox img{max-width:88vw; max-height:82vh; border-radius:8px;}

  @media (max-width:880px){
    body{flex-direction:column;}
    #rail{position:relative; height:auto; width:100%; flex-direction:row; padding:10px 14px; overflow-x:auto;}
    #rail .rmark{margin:0 8px 0 0;}
    .nav-item{margin-bottom:0;}
    #content{padding:18px 16px 40px;}
    .chart-row{grid-template-columns:1fr;}
    .form-row{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
(function(){

const CLUSTER_COLOR = { CSRB: '#5B8C5E', PDTC: '#C1543C' };
const STATUS_CLASS = { 'Early':'early', 'On-time':'ontime', 'Postponed':'postponed', 'Failure':'failure', 'Scheduled':'scheduled' };
let state = { role:'Admin', entity:null, view:'overview', profile:null,
  sessionAttendance: [], sessionSpecials: [], entryType:'Attendance', entryPhoto:null, entryGps:null };

function avatar(id, name, cluster){
  const bg = cluster==='CSRB' ? '5B8C5E' : cluster==='PDTC' ? 'C1543C' : '1F4E5F';
  return `https://api.dicebear.com/7.x/notionists/svg?seed=${encodeURIComponent(id+name)}&backgroundColor=${bg}&backgroundType=solid`;
}
function photoUrl(seed){ return `https://picsum.photos/seed/${encodeURIComponent(seed)}/400/260`; }

// ---------- derived ----------
function dasByPc(pcId){ return DATA.das.filter(d => d.pc === pcId); }
function villagesByDa(daId){ return DATA.villages.filter(v => v.da === daId); }
function sum(arr, key){ return arr.reduce((a,b)=>a+(b[key]||0),0); }
function daById(id){ return DATA.das.find(d=>d.id===id); }
function pcById(id){ return DATA.pcs.find(p=>p.id===id); }
function pmById(id){ return DATA.pms.find(p=>p.id===id); }
function villageById(id){ return DATA.villages.find(v=>v.id===id); }

function allAttendance(){ return DATA.attendanceEntries.concat(state.sessionAttendance); }
function allSpecials(){ return DATA.specialsEntries.concat(state.sessionSpecials); }

function visibleDAs(){
  if(state.role==='PC'){ const pc = pcById(state.entity)||DATA.pcs[0]; return dasByPc(pc.id); }
  if(state.role==='DA'){ const da = daById(state.entity)||DATA.das[0]; return [da]; }
  return DATA.das;
}
function visiblePCs(){
  if(state.role==='PC'){ const pc = pcById(state.entity)||DATA.pcs[0]; return [pc]; }
  if(state.role==='DA'){ const da = daById(state.entity)||DATA.das[0]; return DATA.pcs.filter(p=>p.id===da.pc); }
  return DATA.pcs;
}
function visiblePMs(){ if(state.role==='Admin'||state.role==='PM') return DATA.pms; return []; }
function visibleVillages(){ return visibleDAs().flatMap(d=>villagesByDa(d.id)); }
function visiblePlans(){ const ids = visibleDAs().map(d=>d.id); return DATA.plans.filter(p=>ids.includes(p.da)); }
function visibleAttendance(){ const ids = visibleDAs().map(d=>d.id); return allAttendance().filter(e=>ids.includes(e.da)); }
function visibleSpecials(){ const ids = visibleDAs().map(d=>d.id); return allSpecials().filter(e=>ids.includes(e.da)); }

// entry status resolution per plan (submitted entry OR computed Failure/Scheduled)
function plansWithStatus(type){
  const entries = type==='Attendance' ? allAttendance() : allSpecials();
  const byPlan = {};
  entries.forEach(e=>{ if(!byPlan[e.plan_id] || e.entry_date > byPlan[e.plan_id].entry_date) byPlan[e.plan_id]=e; });
  return visiblePlans().filter(p=>p.type===type).map(p=>{
    const e = byPlan[p.id];
    if(e) return Object.assign({}, e, {village:p.village, committee:p.committee});
    const overdue = p.assigned_date < DATA.today;
    return { id:null, plan_id:p.id, da:p.da, village_id:p.village_id, village:p.village, committee:p.committee,
      entry_date:null, status: overdue ? 'Failure' : 'Scheduled', reason:null, image_seed:null };
  });
}

function lastVisitForVillage(villageId){
  const all = allAttendance().concat(allSpecials()).filter(e=>e.village_id===villageId);
  if(!all.length) return null;
  return all.reduce((a,b)=> a.entry_date>b.entry_date ? a : b);
}

// ---------- top bar ----------
function renderEntityPicker(){
  const el = document.getElementById('entityPicker');
  el.innerHTML = '';
  if(state.role==='PC'){
    el.innerHTML = '<select id="entitySelect">'+DATA.pcs.map(p=>`<option value="${p.id}">${p.name} (${p.cluster})</option>`).join('')+'</select>';
  } else if(state.role==='DA'){
    el.innerHTML = '<select id="entitySelect">'+DATA.das.map(d=>`<option value="${d.id}">${d.name} (${d.cluster})</option>`).join('')+'</select>';
  } else if(state.role==='PM'){
    el.innerHTML = '<select id="entitySelect">'+DATA.pms.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')+'</select>';
  }
  const sel = document.getElementById('entitySelect');
  if(sel){ sel.value = state.entity || sel.options[0].value; state.entity = sel.value;
    sel.addEventListener('change', e=>{ state.entity = e.target.value; state.profile=null; render(); });
  } else state.entity = null;
}
function renderWhoAmI(){
  const el = document.getElementById('whoami');
  let name='Admin', cluster=null, id='ADMIN';
  if(state.role==='PM'){ const p = pmById(state.entity)||DATA.pms[0]; name=p.name; id=p.id; }
  if(state.role==='PC'){ const p = pcById(state.entity)||DATA.pcs[0]; name=p.name+' PC'; cluster=p.cluster; id=p.id; }
  if(state.role==='DA'){ const p = daById(state.entity)||DATA.das[0]; name=p.name; cluster=p.cluster; id=p.id; }
  el.innerHTML = `<img src="${avatar(id,name,cluster)}"><div><div class="wname">${name}</div><div class="wrole">${state.role}</div></div>`;
}

// ---------- shared ----------
function kpiStrip(villages, das, extra){
  const members=sum(villages,'members'), male=sum(villages,'male'), female=sum(villages,'female'), committees=sum(villages,'committees');
  let items=[['Villages',villages.length],['DAs',das.length],['Committees',committees],['Members',members.toLocaleString()],['Male / Female',male+' / '+female]];
  if(extra) items = extra.concat(items);
  return `<div class="kpi-strip">${items.map(([l,n])=>`<div class="kpi"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join('')}</div>`;
}
function hierarchyTable(das){
  const rowsHtml = das.map(d=>{
    const vs=villagesByDa(d.id);
    return `<tr data-da="${d.id}"><td><span class="tag ${d.cluster.toLowerCase()}">${d.cluster}</span></td><td>${d.pc}</td><td>${d.id} — ${d.name}</td><td>${vs.length}</td><td>${sum(vs,'committees')}</td><td>${sum(vs,'members').toLocaleString()}</td></tr>`;
  }).join('');
  return `<table class="ledger clickable" id="hierTable"><thead><tr><th>Cluster</th><th>PC</th><th>DA</th><th>Villages</th><th>Committees</th><th>Members</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
}
function villageTable(villages){
  const rowsHtml = villages.map(v=>{
    const lv = lastVisitForVillage(v.id);
    return `<tr><td>${v.id}</td><td>${v.name}</td><td>${v.mandal}, ${v.district}</td><td><span class="tag ${v.cluster.toLowerCase()}">${v.cluster}</span></td><td>${v.committees}</td><td>${v.male} / ${v.female}</td><td>${v.members}</td><td>${lv?lv.entry_date:'—'}</td></tr>`;
  }).join('');
  return `<table class="ledger"><thead><tr><th>ID</th><th>Village</th><th>Mandal, District</th><th>Cluster</th><th>Committees</th><th>M / F</th><th>Members</th><th>Last visit</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
}
function statusBadge(s){ return `<span class="badge ${STATUS_CLASS[s]||''}">${s}</span>`; }

// ---------- charts (unchanged) ----------
function drawClusterMembersChart(elId, villages){
  const byCluster={CSRB:0,PDTC:0}; villages.forEach(v=>byCluster[v.cluster]+=v.members);
  Plotly.newPlot(elId,[{x:['CSRB','PDTC'],y:[byCluster.CSRB,byCluster.PDTC],type:'bar',marker:{color:['#5B8C5E','#C1543C']},width:[0.5,0.5]}],
    {margin:{t:10,r:10,b:34,l:44},height:220,paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter, sans-serif',size:11,color:'#4b4636'},yaxis:{gridcolor:'#ece5d3'}},
    {displayModeBar:false,responsive:true});
}
function drawCommitteeChart(elId, clusters){
  const rows=DATA.committeeAgg;
  const traces=clusters.map(cl=>({x:rows.map(r=>r.name),y:rows.map(r=>r[cl]),name:cl,type:'bar',marker:{color:CLUSTER_COLOR[cl]}}));
  Plotly.newPlot(elId,traces,{barmode:'group',margin:{t:10,r:10,b:90,l:44},height:250,paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter, sans-serif',size:10.5,color:'#4b4636'},yaxis:{gridcolor:'#ece5d3'},legend:{orientation:'h',y:1.15},xaxis:{tickangle:-35}},
    {displayModeBar:false,responsive:true});
}
function drawGenderDonut(elId, villages){
  const male=sum(villages,'male'), female=sum(villages,'female');
  Plotly.newPlot(elId,[{values:[male,female],labels:['Male','Female'],type:'pie',hole:.55,marker:{colors:['#1F4E5F','#E8A93A']},textfont:{color:'#fff',family:'IBM Plex Mono, monospace',size:11}}],
    {margin:{t:10,r:10,b:10,l:10},height:220,paper_bgcolor:'rgba(0,0,0,0)',showlegend:true,legend:{orientation:'h',y:-0.1},font:{family:'Inter, sans-serif',size:11,color:'#4b4636'}},
    {displayModeBar:false,responsive:true});
}
function drawStatusChart(elId, plansStatus){
  const order=['Early','On-time','Postponed','Failure','Scheduled'];
  const counts = order.map(s=>plansStatus.filter(p=>p.status===s).length);
  const colors = ['#3B6EA5','#5B8C5E','#E8A93A','#C1543C','#c9c2ac'];
  Plotly.newPlot(elId,[{x:order,y:counts,type:'bar',marker:{color:colors}}],
    {margin:{t:10,r:10,b:34,l:38},height:220,paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter, sans-serif',size:11,color:'#4b4636'},yaxis:{gridcolor:'#ece5d3'}},
    {displayModeBar:false,responsive:true});
}

// ---------- three.js hero (unchanged) ----------
let heroAnim;
function initHero(){
  const canvas = document.getElementById('heroCanvas');
  if(!canvas) return;
  const width = canvas.clientWidth, height = 360;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 200);
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setSize(width, height); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  const dl = new THREE.DirectionalLight(0xffe9c2,0.9); dl.position.set(10,20,10); scene.add(dl);
  const grid = new THREE.GridHelper(40,20,0x2c5a6b,0x1c3d49); grid.position.y=-0.2; scene.add(grid);
  const group = new THREE.Group();
  const offsets = {CSRB:[-9,0], PDTC:[9,0]};
  const byCluster = {CSRB:[],PDTC:[]};
  DATA.villages.forEach(v=>byCluster[v.cluster].push(v));
  Object.keys(byCluster).forEach(cl=>{
    const [ox,oz]=offsets[cl], list=byCluster[cl], cols=Math.ceil(Math.sqrt(list.length));
    list.forEach((v,i)=>{
      const row=Math.floor(i/cols), col=i%cols;
      const x=ox+(col-cols/2)*2.6+(Math.random()-0.5)*1.4, z=oz+(row-cols/2)*2.6+(Math.random()-0.5)*1.4;
      const r=0.28+Math.min(v.members,120)/120*0.55;
      const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,16,16), new THREE.MeshStandardMaterial({color:cl==='CSRB'?0x5B8C5E:0xC1543C, emissive:cl==='CSRB'?0x1c3a1d:0x3a1810, roughness:.5, metalness:.1}));
      mesh.position.set(x,r,z); group.add(mesh);
      const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,r,6), new THREE.MeshBasicMaterial({color:0x274b55}));
      stem.position.set(x,r/2,z); group.add(stem);
    });
  });
  scene.add(group);
  function onResize(){ const w=canvas.clientWidth; camera.aspect=w/height; camera.updateProjectionMatrix(); renderer.setSize(w,height); }
  window.addEventListener('resize', onResize);
  let t=0;
  function animate(){ heroAnim=requestAnimationFrame(animate); t+=0.0022; camera.position.x=Math.sin(t)*34; camera.position.z=Math.cos(t)*34; camera.position.y=16; camera.lookAt(0,0,0); renderer.render(scene,camera); }
  animate();
}

// ---------- leaflet map (upgraded popups) ----------
let leafletMap;
function initMap(elId, villages, fit){
  if(leafletMap){ leafletMap.remove(); leafletMap=null; }
  leafletMap = L.map(elId, {scrollWheelZoom:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:17, attribution:'&copy; OpenStreetMap contributors'}).addTo(leafletMap);
  villages.forEach(v=>{
    const color = CLUSTER_COLOR[v.cluster];
    const da = daById(v.da);
    const lv = lastVisitForVillage(v.id);
    const photo = lv ? `<img class="popup-photo" src="${photoUrl(lv.image_seed||lv.id)}">` : '';
    const visitLine = lv ? `Last visit: <b>${lv.entry_date}</b> ${statusBadge(lv.status)}` : `Last visit: <span style="color:#999">no entry yet</span>`;
    const popup = `<b>${v.name}</b><br>${v.mandal}, ${v.district}<br>Cluster: ${v.cluster} · DA: ${da?da.name:v.da}<br>Committees: ${v.committees} · Members: ${v.members} (M ${v.male}/F ${v.female})<br>${visitLine}${photo}`;
    L.circleMarker([v.lat,v.lng], {radius:6+Math.min(v.members,150)/150*7, color:'#fff', weight:1.5, fillColor:color, fillOpacity:.9})
      .bindPopup(popup).addTo(leafletMap);
  });
  if(fit && villages.length){ leafletMap.fitBounds(L.latLngBounds(villages.map(v=>[v.lat,v.lng])), {padding:[30,30]}); }
  else leafletMap.setView([17.9,79.4], 8);
}

// ---------- lightbox ----------
function openLightbox(src){
  const div = document.createElement('div');
  div.className='lightbox';
  div.innerHTML = `<img src="${src}">`;
  div.addEventListener('click', ()=>div.remove());
  document.body.appendChild(div);
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 3200);
}

// ---------- views: OVERVIEW ----------
function overviewView(){
  const villages = visibleVillages(), das = visibleDAs();
  const banner = `<div class="proto-banner">Prototype build, wired to your real Master Data workbook. Attendance/Specials entries below are <b>synthetic demo data</b> (Action_Plans has no Assigned_Date/Type filled in yet) generated to show what live field reporting will look like.</div>`;
  if(state.role==='Admin'){
    return `${banner}
    <div class="section-title">Program overview</div>
    <div class="section-sub">Every Cluster, every PC, every DA. Admin has full CRUD + delete/restore (10-day recycle bin).</div>
    ${kpiStrip(villages, das, [['PCs',DATA.pcs.length],['PMs',DATA.pms.length]])}
    <div id="hero-wrap"><div class="hero-legend"><span><i style="background:#5B8C5E"></i>CSRB</span><span><i style="background:#C1543C"></i>PDTC</span></div><canvas id="heroCanvas"></canvas><div class="hero-caption">42 villages · node size = committee members · see Map tab for real coordinates</div></div>
    <div class="chart-row">
      <div class="panel"><h3>Committee members by type</h3><div class="sub">Grouped by Cluster</div><div id="committeeChart"></div></div>
      <div class="panel"><h3>Gender split</h3><div class="sub">Program-wide</div><div id="genderChart"></div></div>
    </div>
    <div class="ledger-rule"></div>
    <div class="section-title">PC → DA hierarchy</div><div class="section-sub">Click a row to open that DA's profile</div>
    ${hierarchyTable(das)}
    <div class="rbac-note"><b>Admin:</b> Enable, Add, Move, Edit, Disable, Delete (soft-delete → Recycle_Bin, 10-day auto-purge), Restore.</div>`;
  }
  if(state.role==='PM'){
    return `${banner}
    <div class="section-title">Program Manager view</div>
    <div class="section-sub">Access scope: <b>All Clusters</b> — every PC and every DA, read-only.</div>
    ${kpiStrip(villages, das, [['PCs monitored',DATA.pcs.length]])}
    <div class="chart-row"><div class="panel"><h3>Members by Cluster</h3><div id="clusterChart"></div></div><div class="panel"><h3>Gender split</h3><div id="genderChart"></div></div></div>
    <div class="ledger-rule"></div>
    <div class="section-title">All PCs' DAs</div>${hierarchyTable(das)}
    <div class="rbac-note"><b>PM:</b> View only. No Add / Edit / Move / Disable / Delete.</div>`;
  }
  if(state.role==='PC'){
    const pc = pcById(state.entity)||DATA.pcs[0];
    return `${banner}
    <div class="section-title">${pc.name} — Project Coordinator view</div>
    <div class="section-sub">Scoped to <span class="tag ${pc.cluster.toLowerCase()}">${pc.cluster}</span> — own DAs only, via PC_DA_Map</div>
    ${kpiStrip(villages, das)}
    <div class="chart-row"><div class="panel"><h3>Committee members by type — ${pc.cluster}</h3><div id="committeeChart"></div></div><div class="panel"><h3>Gender split — ${pc.cluster}</h3><div id="genderChart"></div></div></div>
    <div class="ledger-rule"></div>
    <div class="section-title">My DAs</div>${hierarchyTable(das)}
    <div class="ledger-rule"></div>
    <div class="section-title">Villages under my DAs</div>${villageTable(villages)}
    <div class="rbac-note"><b>PC:</b> Create/assign Action Plans, monitor DA submissions read-only. No master-data edit. Can't see the other PC's DAs — that's PM's job.</div>`;
  }
  const da = daById(state.entity)||DATA.das[0];
  return `${banner}
    <div class="section-title">${da.name} — Development Agent view</div>
    <div class="section-sub">Own villages only · <span class="tag ${da.cluster.toLowerCase()}">${da.cluster}</span> · reports to ${da.pc}</div>
    ${kpiStrip(villages, [da])}
    <div class="chart-row"><div class="panel" style="grid-column:1/-1"><h3>Gender split — my villages</h3><div id="genderChart"></div></div></div>
    <div class="ledger-rule"></div>
    <div class="section-title">My villages</div>${villageTable(villages)}
    <div class="rbac-note"><b>DA:</b> Attendance + Specials entries against assigned Action Plans. No visibility into other DAs' villages. Use the <b>Entry</b> tab to submit.</div>`;
}

// ---------- DIRECTORY / PROFILE (mostly unchanged, profile gets recent entries) ----------
function personCard(type, obj, locked){
  const cluster = obj.cluster || null;
  const stat1 = type==='DA' ? [obj.villages,'villages'] : type==='PC' ? [dasByPc(obj.id).length,'DAs'] : [DATA.pcs.length,'PCs'];
  const stat2 = type==='DA' ? [obj.members,'members'] : type==='PC' ? [sum(dasByPc(obj.id).flatMap(d=>villagesByDa(d.id)),'members'),'members'] : [DATA.das.length,'DAs'];
  return `<div class="person-card ${locked?'locked-card':''}" data-type="${type}" data-id="${obj.id}">
    <img src="${avatar(obj.id,obj.name,cluster)}">
    <div class="pname">${obj.name}</div>
    <div class="prole">${type==='DA'?'Development Agent':type==='PC'?'Project Coordinator':'Program Manager'}${cluster?' · '+cluster:''}</div>
    <div class="pstats"><div>${stat1[0]}<span>${stat1[1]}</span></div><div>${stat2[0]}<span>${stat2[1]}</span></div></div>
  </div>`;
}
function directoryView(){
  const visDA = visibleDAs().map(d=>d.id), visPC = visiblePCs().map(p=>p.id), visPM = visiblePMs().map(p=>p.id);
  const pmCards = DATA.pms.map(p=>personCard('PM',p, !visPM.includes(p.id))).join('');
  const pcCards = DATA.pcs.map(p=>personCard('PC',p, !visPC.includes(p.id))).join('');
  const daCards = DATA.das.map(d=>personCard('DA',d, !visDA.includes(d.id))).join('');
  return `
    <div class="section-title">People directory</div>
    <div class="section-sub">Every Development Agent, Project Coordinator and Program Manager on the program. Cards outside your current role's scope are shown locked.</div>
    <div class="dir-toolbar"><input id="dirSearch" placeholder="Search by name or ID…"></div>
    <div class="subhead">Program Managers</div><div class="people-grid" id="pmGrid">${pmCards}</div>
    <div class="subhead">Project Coordinators</div><div class="people-grid" id="pcGrid">${pcCards}</div>
    <div class="subhead">Development Agents</div><div class="people-grid" id="daGrid">${daCards}</div>`;
}
function entriesMiniTable(entries){
  if(!entries.length) return '<div class="section-sub">No entries yet.</div>';
  const rowsHtml = entries.slice(0,8).map(e=>`<tr>
    <td>${e.entry_date}</td><td>${e.village}</td><td>${e.committee}</td><td>${statusBadge(e.status)}</td>
    <td>${e.image_seed?`<img class="thumb" src="${photoUrl(e.image_seed)}" onclick="window.__openLightbox('${photoUrl(e.image_seed)}')">`:'—'}</td>
  </tr>`).join('');
  return `<table class="ledger"><thead><tr><th>Date</th><th>Village</th><th>Committee</th><th>Status</th><th>Photo</th></tr></thead><tbody>${rowsHtml}</tbody></table>`;
}
function profileView(){
  const {type,id} = state.profile;
  if(type==='DA'){
    const da = daById(id); const villages = villagesByDa(da.id);
    const recent = allAttendance().concat(allSpecials()).filter(e=>e.da===da.id).sort((a,b)=>b.entry_date.localeCompare(a.entry_date));
    return `<div class="profile-back" id="backToDir">&larr; Back to Directory</div>
    <div class="profile-head"><img src="${avatar(da.id,da.name,da.cluster)}"><div><h2>${da.name}</h2><div class="pmeta">Development Agent · ${da.id} · <span class="tag ${da.cluster.toLowerCase()}">${da.cluster}</span> · reports to ${da.pc}</div></div></div>
    ${kpiStrip(villages,[da])}
    <div class="chart-row"><div class="panel"><h3>${da.name}'s villages</h3><div class="sub">Real coordinates from mandal centers</div><div id="profMap" style="height:260px;border-radius:8px;"></div></div><div class="panel"><h3>Gender split</h3><div id="genderChart"></div></div></div>
    <div class="ledger-rule"></div>
    <div class="section-title">Recent field entries</div><div class="section-sub">Demo data · latest first</div>
    ${entriesMiniTable(recent)}
    <div class="ledger-rule"></div>
    <div class="section-title">Villages</div>${villageTable(villages)}`;
  }
  if(type==='PC'){
    const pc = pcById(id); const das = dasByPc(pc.id); const villages = das.flatMap(d=>villagesByDa(d.id));
    return `<div class="profile-back" id="backToDir">&larr; Back to Directory</div>
    <div class="profile-head"><img src="${avatar(pc.id,pc.name,pc.cluster)}"><div><h2>${pc.name} Coordinator</h2><div class="pmeta">Project Coordinator · ${pc.id} · <span class="tag ${pc.cluster.toLowerCase()}">${pc.cluster}</span></div></div></div>
    ${kpiStrip(villages, das)}
    <div class="chart-row"><div class="panel"><h3>Team villages</h3><div id="profMap" style="height:260px;border-radius:8px;"></div></div><div class="panel"><h3>Gender split</h3><div id="genderChart"></div></div></div>
    <div class="ledger-rule"></div>
    <div class="section-title">DAs under ${pc.name}</div>${hierarchyTable(das)}`;
  }
  const pm = pmById(id); const villages = DATA.villages;
  return `<div class="profile-back" id="backToDir">&larr; Back to Directory</div>
    <div class="profile-head"><img src="${avatar(pm.id,pm.name,null)}"><div><h2>${pm.name}</h2><div class="pmeta">Program Manager · ${pm.id} · Access scope: ${pm.scope}</div></div></div>
    ${kpiStrip(villages, DATA.das, [['PCs',DATA.pcs.length]])}
    <div class="chart-row"><div class="panel"><h3>All villages</h3><div id="profMap" style="height:260px;border-radius:8px;"></div></div><div class="panel"><h3>Gender split</h3><div id="genderChart"></div></div></div>
    <div class="ledger-rule"></div>
    <div class="section-title">All PCs &amp; DAs</div>${hierarchyTable(DATA.das)}`;
}

// ---------- MAP ----------
function mapView(){
  return `<div class="section-title">Village map</div>
    <div class="section-sub">Real mandal-level coordinates (geocoded), villages jittered within their mandal for readability — pending exact GPS per village. Click a marker for the last field visit, its status and photo.</div>
    <div class="map-legend"><span><i style="background:#5B8C5E"></i>CSRB</span><span><i style="background:#C1543C"></i>PDTC</span><span style="color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;">marker size = committee members</span></div>
    <div id="mapEl"></div>`;
}

// ---------- REPORTS ----------
function reportsView(){
  const attPlans = plansWithStatus('Attendance');
  const spPlans = plansWithStatus('Specials');
  const counts = (arr)=>({Early:arr.filter(p=>p.status==='Early').length, Ontime:arr.filter(p=>p.status==='On-time').length, Postponed:arr.filter(p=>p.status==='Postponed').length, Failure:arr.filter(p=>p.status==='Failure').length, Scheduled:arr.filter(p=>p.status==='Scheduled').length});
  const ac = counts(attPlans);
  return `
    <div class="demo-banner">Attendance &amp; Specials entries are <b>synthetic demo data</b> — 183 Attendance + 64 Specials generated against your 351 real Action Plans, since Assigned_Date/Type aren't filled in the master workbook yet. Status logic follows your rule: before assigned = Early, on assigned = On-time, after = Postponed, no entry past due = Failure.</div>
    <div class="section-title">Field reports</div>
    <div class="section-sub">Scoped to ${state.role==='Admin'||state.role==='PM' ? 'the whole program' : state.role==='PC' ? 'your DAs' : 'you'}</div>
    <div class="kpi-strip">
      <div class="kpi st-early"><div class="num">${ac.Early}</div><div class="lbl">Early</div></div>
      <div class="kpi st-ontime"><div class="num">${ac.Ontime}</div><div class="lbl">On-time</div></div>
      <div class="kpi st-postponed"><div class="num">${ac.Postponed}</div><div class="lbl">Postponed</div></div>
      <div class="kpi st-failure"><div class="num">${ac.Failure}</div><div class="lbl">Failure</div></div>
      <div class="kpi"><div class="num">${ac.Scheduled}</div><div class="lbl">Scheduled</div></div>
    </div>
    <div class="panel" style="margin-top:16px;"><h3>Attendance status mix</h3><div id="statusChart"></div></div>

    <div class="ledger-rule"></div>
    <div class="filter-bar">
      <div class="type-toggle" id="reportTypeToggle" style="max-width:260px;">
        <button data-t="Attendance" class="active">Attendance</button>
        <button data-t="Specials">Specials</button>
      </div>
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option>Early</option><option>On-time</option><option>Postponed</option><option>Failure</option><option>Scheduled</option>
      </select>
    </div>
    <div id="reportTable"></div>
  `;
}
function reportTableHtml(type, statusFilter){
  let plans = plansWithStatus(type);
  if(statusFilter) plans = plans.filter(p=>p.status===statusFilter);
  plans.sort((a,b)=> (b.entry_date||'0000').localeCompare(a.entry_date||'0000'));
  const extraCol = type==='Attendance' ? 'M / F (live)' : 'Participants';
  const rowsHtml = plans.map(p=>{
    const da = daById(p.da);
    const extra = type==='Attendance' ? (p.male_live!=null ? `${p.male_live} / ${p.female_live}` : '—') : (p.participants!=null?p.participants:'—');
    const photo = p.image_seed ? `<img class="thumb" src="${photoUrl(p.image_seed)}" onclick="window.__openLightbox('${photoUrl(p.image_seed)}')">` : '—';
    const gps = p.village_id ? villageById(p.village_id) : null;
    const gpsLink = gps ? `<a class="gpslink" target="_blank" href="https://www.google.com/maps?q=${gps.lat},${gps.lng}">map ↗</a>` : '—';
    return `<tr><td>${p.entry_date||'—'}</td><td>${da?da.name:p.da}</td><td>${p.village}</td><td>${p.committee}</td><td>${statusBadge(p.status)}</td><td>${extra}</td><td>${p.reason||''}</td><td>${photo}</td><td>${gpsLink}</td></tr>`;
  }).join('');
  return `<table class="ledger"><thead><tr><th>Date</th><th>DA</th><th>Village</th><th>Committee</th><th>Status</th><th>${extraCol}</th><th>Reason</th><th>Photo</th><th>GPS</th></tr></thead><tbody>${rowsHtml||'<tr><td colspan="9" style="color:var(--muted)">No entries match.</td></tr>'}</tbody></table>`;
}

// ---------- ENTRY (DA data entry form) ----------
function entryView(){
  if(state.role!=='DA'){
    return `<div class="section-title">Data entry</div>
    <div class="section-sub">This form is for the Development Agent role.</div>
    <div class="demo-banner">Switch the role selector at top to <b>DA</b> and pick a Development Agent to submit an Attendance or Specials entry against one of their Action Plans.</div>`;
  }
  const da = daById(state.entity)||DATA.das[0];
  const myPlans = DATA.plans.filter(p=>p.da===da.id && p.type===state.entryType);
  const options = myPlans.map(p=>`<option value="${p.id}">${p.village} — ${p.committee} (due ${p.assigned_date})</option>`).join('');
  return `
    <div class="section-title">Submit a field entry</div>
    <div class="section-sub">${da.name} · ${da.cluster} · reports to ${da.pc}</div>
    <div class="demo-banner">This form writes to an in-memory session only — there's no backend yet, so submissions reset on page reload. It shows exactly what the real DA PWA entry screen would collect.</div>
    <div class="entry-form">
      <label>Entry type</label>
      <div class="type-toggle" id="entryTypeToggle">
        <button data-t="Attendance" class="${state.entryType==='Attendance'?'active':''}">Attendance</button>
        <button data-t="Specials" class="${state.entryType==='Specials'?'active':''}">Specials</button>
      </div>

      <label>Action plan</label>
      <select id="planSelect">${options || '<option>No plans of this type</option>'}</select>

      <div class="form-row">
        <div><label>Entry date</label><input type="date" id="entryDate" value="${DATA.today}"></div>
        <div><label>Status</label><select id="statusSelect"><option>Early</option><option selected>On-time</option><option>Postponed</option></select></div>
      </div>

      <label>Reason <span style="text-transform:none;font-weight:400;">(only needed for Early / Postponed)</span></label>
      <textarea id="reasonInput" placeholder="e.g. Field visit delayed due to heavy rain"></textarea>

      ${state.entryType==='Attendance' ? `
      <div class="form-row">
        <div><label>Male count (live)</label><input type="number" id="maleLive" min="0" value="0"></div>
        <div><label>Female count (live)</label><input type="number" id="femaleLive" min="0" value="0"></div>
      </div>
      <label>New members this visit</label>
      <input type="number" id="newMembers" min="0" value="0">
      <label>Visit designations present</label>
      <div class="desig-chips">
        ${['President','Vice President','Secretary','Member'].map(d=>`<label><input type="checkbox" value="${d}" checked> ${d}</label>`).join('')}
      </div>` : `
      <div class="form-row">
        <div><label>Participants count</label><input type="number" id="participants" min="0" value="0"></div>
        <div><label>Scope</label><select id="scopeSelect"><option>Under VDC</option><option>Independent</option></select></div>
      </div>`}

      <label>GPS location</label>
      <div class="gps-row">
        <button type="button" id="gpsBtn">📍 Capture current location</button>
        <span class="gpsval" id="gpsVal">Not captured — will default to village coordinates</span>
      </div>

      <label>Field photo</label>
      <div class="photo-drop" id="photoDrop">
        <div id="photoPlaceholder">Tap to attach a photo (camera or file)</div>
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
        <div id="photoPreviewWrap"></div>
      </div>

      <button class="submit-btn" id="submitEntry">Submit entry</button>
      <div class="form-note">Real build: this posts to Flask → MySQL, image uploads to object storage, GPS pulled from the device automatically. Here it's captured the same way but kept in this browser tab only.</div>
    </div>
  `;
}

// ---------- master render ----------
function setTitle(){
  const titleMap = {overview:{Admin:'Overview — Admin',PM:'Overview — Program Manager',PC:'Overview — Project Coordinator',DA:'Overview — Development Agent'}, directory:'Directory', map:'Village Map', reports:'Field Reports', entry:'Data Entry'};
  const t = state.profile ? 'Profile' : (typeof titleMap[state.view]==='string' ? titleMap[state.view] : titleMap[state.view][state.role]);
  document.getElementById('viewTitle').textContent = t;
}

function wireReportsView(){
  let currentType='Attendance', currentStatus='';
  const renderTable = ()=>{ document.getElementById('reportTable').innerHTML = reportTableHtml(currentType, currentStatus); };
  document.querySelectorAll('#reportTypeToggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentType = btn.dataset.t;
      document.querySelectorAll('#reportTypeToggle button').forEach(b=>b.classList.toggle('active', b===btn));
      renderTable();
    });
  });
  document.getElementById('statusFilter').addEventListener('change', e=>{ currentStatus=e.target.value; renderTable(); });
  renderTable();
  drawStatusChart('statusChart', plansWithStatus('Attendance'));
}

function wireEntryView(){
  if(state.role!=='DA') return;
  document.querySelectorAll('#entryTypeToggle button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.entryType = btn.dataset.t; state.entryPhoto=null; render(); });
  });
  const gpsBtn = document.getElementById('gpsBtn');
  const gpsVal = document.getElementById('gpsVal');
  gpsBtn.addEventListener('click', ()=>{
    if(navigator.geolocation){
      gpsVal.textContent = 'Locating…';
      navigator.geolocation.getCurrentPosition(pos=>{
        state.entryGps = {lat:pos.coords.latitude.toFixed(5), lng:pos.coords.longitude.toFixed(5)};
        gpsVal.textContent = `${state.entryGps.lat}, ${state.entryGps.lng}`;
      }, ()=>{ gpsVal.textContent = 'Permission denied — will default to village coordinates'; });
    } else { gpsVal.textContent = 'Geolocation not available on this device'; }
  });
  const photoDrop = document.getElementById('photoDrop');
  const photoInput = document.getElementById('photoInput');
  photoDrop.addEventListener('click', ()=>photoInput.click());
  photoInput.addEventListener('change', ()=>{
    const file = photoInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      state.entryPhoto = reader.result;
      document.getElementById('photoPreviewWrap').innerHTML = `<img src="${reader.result}">`;
      document.getElementById('photoPlaceholder').textContent = file.name;
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('submitEntry').addEventListener('click', ()=>{
    const da = daById(state.entity)||DATA.das[0];
    const planId = document.getElementById('planSelect').value;
    const plan = DATA.plans.find(p=>p.id===planId);
    if(!plan){ toast('No plan selected'); return; }
    const status = document.getElementById('statusSelect').value;
    const reason = document.getElementById('reasonInput').value || null;
    const date = document.getElementById('entryDate').value || DATA.today;
    const village = villageById(plan.village_id);
    const gps = state.entryGps || (village?{lat:village.lat,lng:village.lng}:{lat:null,lng:null});
    const seed = 'session-'+Date.now();

    if(state.entryType==='Attendance'){
      const male = parseInt(document.getElementById('maleLive').value||0);
      const female = parseInt(document.getElementById('femaleLive').value||0);
      const newMembers = parseInt(document.getElementById('newMembers').value||0);
      const desigs = Array.from(document.querySelectorAll('.desig-chips input:checked')).map(i=>i.value).join(', ');
      state.sessionAttendance.push({
        id:'SESSA'+Date.now(), plan_id:plan.id, da:da.id, village_id:plan.village_id, village:plan.village,
        committee:plan.committee, entry_date:date, status, reason, image_seed: state.entryPhoto?null:seed,
        image_data: state.entryPhoto, male_live:male, female_live:female, total_live:male+female,
        new_members:newMembers, designations:desigs, gps_lat:gps.lat, gps_lng:gps.lng
      });
    } else {
      const participants = parseInt(document.getElementById('participants').value||0);
      const scope = document.getElementById('scopeSelect').value;
      state.sessionSpecials.push({
        id:'SESSS'+Date.now(), plan_id:plan.id, da:da.id, village_id:plan.village_id, village:plan.village,
        committee:plan.committee, special:plan.committee, entry_date:date, status, reason,
        image_seed: state.entryPhoto?null:seed, participants, scope, gps_lat:gps.lat, gps_lng:gps.lng
      });
    }
    toast('Entry saved to this session — check the Reports tab.');
    state.entryPhoto=null; state.entryGps=null;
    render();
  });
}

window.__openLightbox = openLightbox;

function render(){
  renderEntityPicker();
  renderWhoAmI();
  document.querySelectorAll('#roleSeg button').forEach(b=>b.classList.toggle('active', b.dataset.role===state.role));
  document.querySelectorAll('.nav-item').forEach(n=>n.querySelector('.nav-btn').classList.toggle('active', n.dataset.view===state.view));
  setTitle();
  if(heroAnim) cancelAnimationFrame(heroAnim);

  const content = document.getElementById('content');
  if(state.profile){
    content.innerHTML = profileView();
    document.getElementById('backToDir').addEventListener('click', ()=>{ state.profile=null; render(); });
    requestAnimationFrame(()=>{
      const {type,id} = state.profile;
      let villages;
      if(type==='DA') villages = villagesByDa(id);
      else if(type==='PC') villages = dasByPc(id).flatMap(d=>villagesByDa(d.id));
      else villages = DATA.villages;
      drawGenderDonut('genderChart', villages);
      initMap('profMap', villages, true);
    });
    return;
  }

  if(state.view==='overview'){
    content.innerHTML = overviewView();
    requestAnimationFrame(()=>{
      const villages = visibleVillages();
      if(state.role==='Admin'){ initHero(); drawCommitteeChart('committeeChart',['CSRB','PDTC']); drawGenderDonut('genderChart',villages); }
      else if(state.role==='PM'){ drawClusterMembersChart('clusterChart',DATA.villages); drawGenderDonut('genderChart',villages); }
      else if(state.role==='PC'){ const pc=pcById(state.entity)||DATA.pcs[0]; drawCommitteeChart('committeeChart',[pc.cluster]); drawGenderDonut('genderChart',villages); }
      else { drawGenderDonut('genderChart',villages); }
      const hier = document.getElementById('hierTable');
      if(hier) hier.querySelectorAll('tbody tr').forEach(tr=>tr.addEventListener('click', ()=>{ state.profile={type:'DA', id:tr.dataset.da}; render(); }));
    });
  } else if(state.view==='directory'){
    content.innerHTML = directoryView();
    content.querySelectorAll('.person-card').forEach(card=>{
      card.addEventListener('click', ()=>{ if(card.classList.contains('locked-card')) return; state.profile = {type:card.dataset.type, id:card.dataset.id}; render(); });
    });
    const search = document.getElementById('dirSearch');
    search.addEventListener('input', ()=>{
      const q = search.value.toLowerCase();
      content.querySelectorAll('.person-card').forEach(card=>{
        const txt = card.querySelector('.pname').textContent.toLowerCase()+' '+card.dataset.id.toLowerCase();
        card.style.display = txt.includes(q) ? '' : 'none';
      });
    });
  } else if(state.view==='map'){
    content.innerHTML = mapView();
    requestAnimationFrame(()=>initMap('mapEl', visibleVillages(), true));
  } else if(state.view==='reports'){
    content.innerHTML = reportsView();
    requestAnimationFrame(wireReportsView);
  } else if(state.view==='entry'){
    content.innerHTML = entryView();
    requestAnimationFrame(wireEntryView);
  }
}

document.querySelectorAll('#roleSeg button').forEach(btn=>{
  btn.addEventListener('click', ()=>{ state.role=btn.dataset.role; state.entity=null; state.profile=null; render(); });
});
document.querySelectorAll('.nav-item').forEach(item=>{
  item.querySelector('.nav-btn').addEventListener('click', ()=>{ state.view=item.dataset.view; state.profile=null; render(); });
});

render();
})();
</script>
</body>
</html>
