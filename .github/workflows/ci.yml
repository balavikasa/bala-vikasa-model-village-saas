name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Validate
        run: python scripts/validate_release.py --require-runtime
      - name: Lint
        run: ruff check .
      - name: Migration smoke test
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production
          DATABASE_URL: sqlite:///instance/ci.db
        run: flask --app wsgi db upgrade
