name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Validate
        run: python scripts/validate_release.py --require-runtime

      - name: Lint
        run: ruff check .

      - name: Migration smoke test
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production
          DATABASE_URL: sqlite:///ci.db
        run: |
          rm -f instance/ci.db
          flask --app wsgi db upgrade
          flask --app wsgi db current
